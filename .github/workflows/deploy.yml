# Zero-downtime production deploy.
# Builds in a NEW release folder on the server, then flips `current` symlink + PM2 reload.
# Live traffic keeps serving the previous release while the new one builds.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (branch, tag, or SHA)'
        required: false
        default: main

concurrency:
  group: deploy-admin-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy administration (zero-downtime)
    runs-on: ubuntu-latest
    # Auto-deploy only when CI on main succeeded; manual dispatch always allowed.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    environment: production
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve release SHA
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup SSH and trust host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY production secret is required}"
          : "${DEPLOY_HOST:?DEPLOY_HOST production secret is required}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          HOST="$(printf '%s' "$DEPLOY_HOST" | tr -d '\r' | xargs)"
          PORT="${DEPLOY_PORT:-22}"
          HOST_KEYS="$(mktemp)"
          trap 'rm -f "$HOST_KEYS"' EXIT

          # Production can briefly reject new connections during restart/firewall reload.
          # Retry host-key discovery instead of failing the deployment immediately.
          FOUND=false
          for ATTEMPT in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p "$PORT" -H "$HOST" > "$HOST_KEYS" 2>/dev/null && [[ -s "$HOST_KEYS" ]]; then
              cat "$HOST_KEYS" >> ~/.ssh/known_hosts
              FOUND=true
              break
            fi
            echo "SSH host-key scan attempt ${ATTEMPT}/5 failed; retrying..."
            sleep 5
          done
          if [[ "$FOUND" != true ]]; then
            echo "::error::Unable to reach the deployment host on SSH port ${PORT} after 5 attempts."
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<'EOF'
          Host *
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload release + run remote deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_ADMIN }}
          RELEASE_SHA: ${{ steps.meta.outputs.sha }}
          HEALTH_URL: ${{ secrets.ADMIN_HEALTH_URL }}
        run: |
          set -euo pipefail
          : "${DEPLOY_USER:?DEPLOY_USER production secret is required}"
          : "${DEPLOY_HOST:?DEPLOY_HOST production secret is required}"

          HOST="$(printf '%s' "$DEPLOY_HOST" | tr -d '\r' | xargs)"
          DEPLOY_LOGIN="$(printf '%s' "$DEPLOY_USER" | tr -d '\r' | xargs)"
          PORT="${DEPLOY_PORT:-22}"
          APP_PATH="${DEPLOY_PATH:-/var/www/vbiz-me-administration}"
          CHECK_URL="$(printf '%s' "${HEALTH_URL:-}" | tr -d '\r' | xargs || true)"
          if [[ -z "$CHECK_URL" || ! "$CHECK_URL" =~ ^https?:// ]]; then
            CHECK_URL="http://127.0.0.1:3009/"
          fi
          REMOTE="${DEPLOY_LOGIN}@${HOST}"
          RELEASE_DIR="${APP_PATH}/releases/${RELEASE_SHA}"

          ssh -p "$PORT" "$REMOTE" "mkdir -p '${APP_PATH}/releases' '${APP_PATH}/shared'"

          # Sync source into a fresh release directory (never into live `current`).
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.env' \
            --exclude '.env.*' \
            -e "ssh -p ${PORT}" \
            ./ "${REMOTE}:${RELEASE_DIR}/"

          # Build + atomic symlink flip + PM2 reload on the server.
          # Strip UTF-8 BOM if an editor saved one (breaks `bash -s` shebang).
          ssh -p "$PORT" "$REMOTE" \
            "RELEASE_SHA='${RELEASE_SHA}' DEPLOY_PATH='${APP_PATH}' HEALTH_URL='${CHECK_URL}' bash -s" \
            < <(sed '1s/^\xEF\xBB\xBF//' deploy/remote-deploy.sh)
